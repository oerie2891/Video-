[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtrans"
version = "0.1.0"
description = "Subtitles and transcripts from any video or audio file, and translation of media, subtitle or text files into any language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["subtitles", "transcription", "translation", "whisper", "srt", "vtt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]

# Everything needed for the default setup: local transcription, LLM
# translation, the web UI and document I/O.
dependencies = [
  "faster-whisper>=1.0",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Offline translation. Large: pulls torch and ~2.5 GB of model weights.
local-mt = ["transformers>=4.40", "torch>=2.2", "sentencepiece>=0.2"]
# OpenAI-compatible cloud transcription and/or translation.
openai = ["openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
subtrans = "subtrans.cli:main"

[project.urls]
Repository = "https://github.com/oerie2891/video-"

[tool.setuptools]
packages = ["subtrans", "subtrans.asr", "subtrans.translate", "subtrans.formats"]

[tool.setuptools.package-data]
subtrans = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
